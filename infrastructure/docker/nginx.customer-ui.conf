server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Dev inbox (compose.stack.yaml only): same-origin and read/clear only, so the widget needs no CORS or extra
  # port. Sending (POST /emails) is not exposed. The variable keeps nginx starting when `devmail` is absent.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location ~ ^/__devmail/(widget\.js|api/messages)$ {
    limit_except GET DELETE { deny all; }
    set $devmail_upstream http://devmail:8025;
    rewrite ^/__devmail/(.*)$ /$1 break;
    proxy_pass $devmail_upstream;
  }

  # Hashed build assets are immutable; the SPA shell must never be cached.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
