name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: twipay
          POSTGRES_PASSWORD: twipay_ci_password
          POSTGRES_DB: twipay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twipay -d twipay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_URL: http://127.0.0.1:3000
      ADMIN_URL: http://127.0.0.1:3001
      API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      DATABASE_URL: postgresql://twipay:twipay_ci_password@127.0.0.1:5432/twipay_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_HASH_PEPPER: ci-only-session-pepper-change-me-000000000000
      SESSION_ABSOLUTE_TTL_SECONDS: '604800'
      SESSION_IDLE_TTL_SECONDS: '86400'
      SESSION_TOUCH_INTERVAL_SECONDS: '300'
      MFA_STEP_UP_MAX_AGE_SECONDS: '600'
      MFA_RECOVERY_HMAC_KEY: ci-only-mfa-recovery-key-change-me-000000000
      MFA_TOTP_ISSUER: TwiPay-CI
      MFA_ENROLLMENT_TTL_SECONDS: '600'
      MFA_MAX_FAILED_ATTEMPTS: '5'
      MFA_LOCK_SECONDS: '300'
      DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      PII_FINGERPRINT_KEY: ci-only-fingerprint-key-change-me-000000000
      TICKET_SIGNING_KEYS_JSON: '{"1":"ci-only-ticket-signing-key-change-me-000000000"}'
      TICKET_SIGNING_CURRENT_VERSION: '1'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: corepack enable
      - name: Verify ErhaPay-based customer CI, visual assets and inactive financial flags
        run: node scripts/qualification/phase1-4-6-gates.mjs
      - name: Original ErhaPay source design and visual asset integrity
        run: |
          node scripts/design/erhapay-ui-inventory.mjs --check
          node --test docs/design/test/*.test.mjs
      - name: Require genuine lockfile
        run: test -f pnpm-lock.yaml || (echo 'pnpm-lock.yaml is required; run a genuine pnpm install and commit its generated lockfile' && exit 1)
      - run: node scripts/qualification/phase1-3-preflight.mjs --check-lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @twipay/database prisma:validate
      - run: pnpm --filter @twipay/database prisma:deploy
      - run: pnpm test:repo
      - name: Full Phase 1–5 offline source and behavioral regression
        run: pnpm test:offline-regression
      - run: node scripts/git-history-secret-check.mjs
      - name: Isolated ErhaPay and integration-contract regression tests
        run: |
          pnpm test:isolated-regression
          pnpm test:phase1
          pnpm test:phase1-3
          pnpm test:phase1-4-6
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: PostgreSQL hardening integration
        run: pnpm --filter @twipay/database test
      - name: Redis/BullMQ worker integration
        run: pnpm --filter @twipay/worker test:integration
      - run: pnpm build
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-source-policy-evidence
          path: out/phase1-4-6-gates.json
