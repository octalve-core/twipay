name: Staging DAST

on:
  workflow_dispatch:
    inputs:
      target:
        description: HTTPS staging base URL (no credentials or query secrets)
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    environment: staging-security
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enforce staging HTTPS target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          [[ "$TARGET" =~ ^https://[^/?#]+(/[^?#]*)?$ ]] || { echo 'Target must be an HTTPS staging URL without query/fragment secrets'; exit 1; }
          [[ "$TARGET" != *"twipay.co"* || "$TARGET" == *"staging"* ]] || { echo 'Refusing an ambiguous production-like target'; exit 1; }
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target }}
          fail_action: true
          allow_issue_writing: false
