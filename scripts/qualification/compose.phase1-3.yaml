# Disposable LOCAL qualification stack. Do not use with real customer data.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: twipay_qualification
      POSTGRES_PASSWORD: ${PHASE13_DB_PASSWORD:?Required per-run random password}
      POSTGRES_DB: twipay_qual_test
    ports:
      - "127.0.0.1:${PHASE13_PG_PORT:-15435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twipay_qualification -d twipay_qual_test"]
      interval: 3s
      timeout: 3s
      retries: 25
    tmpfs:
      - /var/lib/postgresql
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${PHASE13_REDIS_PORT:-16382}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 25
    tmpfs:
      - /data
