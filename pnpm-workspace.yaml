packages:
  - "apps/*"
  - "packages/*"
  - "packages/providers/*/*"

# Merged from developer runtime qualification; review dependency install scripts before release.
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  # customer-ui dependencies; install scripts are optional (banner/telemetry/native fallbacks) and stay disabled.
  "@firebase/util": false
  core-js: false
  protobufjs: false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
